[workspace]
resolver = "2"
members = [
    "crates/splitdisk-core",
    "crates/splitdisk-auth",
    "crates/splitdisk-create",
    "crates/splitdisk-assemble",
    "crates/splitdisk-tui",
    "crates/splitdisk-image",
]
default-members = ["crates/splitdisk-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.75"
authors = ["SplitDisk contributors"]
repository = "https://github.com/splitdisk/splitdisk"

[workspace.dependencies]
# Core crypto (approved; see docs/SPEC.md §4.4 / §16)
chacha20poly1305 = "0.10"
serpent = "0.1"
twofish = "0.1"
poly1305 = "0.8"
hkdf = "0.12"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
vsss-rs = "5"
reed-solomon-erasure = "6"
getrandom = "0.2"
rand_core = "0.6"
rand_chacha = "0.3"
thiserror = "1"
proptest = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
gpt = "3"
fatfs = { version = "0.3", default-features = false, features = ["std", "alloc"] }
cpio = "0.2"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
byteorder = "1"

# Curves (Brainpool; see docs/OPEN-QUESTIONS.md (a)) — not used until
# RustCrypto enables Brainpool arithmetic without the WIP feature gate.
bp256 = "0.6"
bp384 = "0.6"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "unwind"
