name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test -t splitdisk-test:ci .

      - name: Run fmt, clippy, test, deny in container
        run: |
          mkdir -p testdata
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=2g \
            --tmpfs /home/builder:rw,nosuid,nodev,size=512m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 1000:1000 \
            -v "$PWD:/work:ro" \
            -v "$PWD/testdata:/work/testdata:rw" \
            -e CARGO_HOME=/tmp/cargo-home \
            -e CARGO_TARGET_DIR=/tmp/cargo-target \
            -e HOME=/home/builder \
            splitdisk-test:ci \
            bash -c 'mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" && bash scripts/docker-test-inner.sh'
