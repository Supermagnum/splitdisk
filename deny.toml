# cargo-deny configuration for SplitDisk.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "GPL-3.0",
    "LGPL-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.8
exceptions = []

# Ignore unpublished *workspace* crates only (path packages not on crates.io).
# crates.io dependencies are still checked against the allow list above; a
# third-party crate with a disallowed license would still fail `cargo deny`.
# Motive: cargo-deny 0.16.3's allow-list grammar rejects SPDX "GPL-3.0-only"
# used by this workspace's Cargo.toml `license` field.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
